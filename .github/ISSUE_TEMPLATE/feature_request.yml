name: Feature or connector request
description: A step, connector, or capability Dazyflow does not have.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Check [TODO.md](https://github.com/dazyflow/dazyflow/blob/master/TODO.md) first — the connector backlog is
        ranked there, with the reasoning, and
        [Decided against](https://github.com/dazyflow/dazyflow/blob/master/TODO.md#decided-against) records what
        was considered and declined.

  - type: textarea
    id: job
    attributes:
      label: What are you trying to automate
      description: |
        The job in your own words, not in Dazyflow vocabulary — "text me when an
        invoice goes unpaid for a week" rather than "add a poll trigger". The
        job is what decides the shape of the answer.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: By hand, in another tool, or a workaround inside Dazyflow.
    validations:
      required: true

  - type: input
    id: service
    attributes:
      label: Service and API docs
      description: For a connector request — the service, and a link to its API documentation.
      placeholder: "Visma eEkonomi — https://developer.vismaonline.com"

  - type: dropdown
    id: auth
    attributes:
      label: How does that service authenticate
      description: |
        This is the main cost driver, so it changes the ranking. A static API key
        is roughly half a day; OAuth with token refresh is substantially more.
      options:
        - Static API key or token
        - OAuth 2
        - Something else
        - I don't know
