# CI: the only thing that builds and tests this repository.
#
#   master / PR   gates + build both images. Pushes nothing, deploys nothing.
#   version tag   the release: gates, publish to ghcr, call the deploy webhook.
#                 THE ONLY PATH THAT REACHES PRODUCTION.
#   dispatch      with publish=true, re-publishes images and stops. It cannot
#                 deploy, so re-cutting an image is never one checkbox from shipping.
#
# GITHUB_TOKEN authenticates against ghcr.io given `packages: write` below.
name: CI

on:
  push:
    branches: [master]
    # A pushed version tag IS the release. `make patch` prints
    # `git push origin master <tag>`, which starts a branch run and the releasing
    # tag run. The pattern must match the whole ref, so 1.0.0-rc1 does not match:
    # a pre-release must not move `:latest` or deploy (LATEST_TAG in the Makefile
    # filters the same way).
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Push images to ghcr.io (does NOT deploy — only a tag push deploys)"
        type: boolean
        default: false

# Least privilege by default; the images job widens it to write packages.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs on push and pull_request — a second commit to a
  # branch makes the first run's verdict worthless, and the queue is shared.
  #
  # NEVER for a workflow_dispatch or a tag: those are the paths that push to
  # ghcr and call the deploy webhook, and cancelling mid-push leaves half the
  # images published. A tag ref is unique so nothing should supersede it anyway
  # — this states the intent rather than relying on that.
  cancel-in-progress: >-
    ${{ github.event_name != 'workflow_dispatch'
        && !startsWith(github.ref, 'refs/tags/') }}

env:
  # Plain local test credentials, not secrets — they address the service
  # containers below. The bulk of the integration suite skips unless these are
  # set (Postgres-gated tests read DAZYFLOW_TEST_DB, the drops/db MySQL tests
  # read DAZYFLOW_TEST_MYSQL, the live-DSN verify check reads DZ_TEST_PG_DSN),
  # so CI runs what a developer with both databases gets — nothing silently
  # skips.
  DAZYFLOW_TEST_DB: postgres://dazyflow:dazyflow@localhost:5432/dazyflow_test
  DAZYFLOW_TEST_MYSQL: dazyflow:dazyflow@tcp(127.0.0.1:3306)/dazyflow_test?parseTime=true
  DZ_TEST_PG_DSN: postgres://dazyflow:dazyflow@localhost:5432/dazyflow_test?sslmode=disable

jobs:
  # ------------------------------------------------------------- static gates
  #
  # Everything that answers in seconds, split out of the race suite so a gofmt
  # slip or a dangling doc link comes back in a minute. `go build` and `go vet`
  # compile the whole module, so they run once here rather than per shard.
  gates:
    name: Build, vet, and the fast gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # check-changelog compares a released section against the commit that
          # released it, which does not work on a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # Cheapest gate, so it runs first. `gofmt -l` prints offending files and
      # exits 0 either way, hence the explicit emptiness check.
      - name: gofmt
        run: make fmt-check

      # .env.example is the configuration reference, not a sample: `make env`
      # copies from it and the Dockerfile calls it "the full catalogue". It had
      # drifted to fifteen missing knobs, several with a documented sibling —
      # DAZYFLOW_TRUSTED_PROXIES absent while DAZYFLOW_TRUST_PROXY_HEADERS is in
      # three places — which is the shape that misleads rather than merely
      # omits.
      - name: Config catalogue up to date
        run: make env-check

      # The wide net over every tracked .md file. web/src/docs/content.test.ts
      # covers docs/guide/ alone, and keeps the two-resolver rules that apply to
      # guide pages only.
      - name: Doc links resolve
        run: make links-check

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # The runner agent and runner.sh are Python and POSIX sh, so the Go suite
      # cannot see what they DO — it only checks the embedded copies still match
      # the source (TestEmbeddedRunnerFilesMatchTheSource). Everything that makes
      # them trustworthy is in these unittest suites: a single-use token refused
      # before anything spends it, the registration token never reaching a file,
      # an allow-list surviving a reinstall, runner.env read rather than
      # evaluated, a service actually wired to start at boot. Unrun, they rot.
      - name: Runner agent tests
        run: make runner-test

      # The two catalogues the web guards read (the app list behind the
      # integration description guard, the drop text behind the Swedish coverage
      # guard) are generated from the live drop registry and committed. A stale
      # one makes its guard pass vacuously — "every drop has a Swedish
      # description" is only true of the drops the snapshot remembers.
      - name: Catalogues up to date
        run: make catalogs-check

      # A released CHANGELOG section describes what is in its tag. Editing one is
      # invisible in review — correct prose under a plausible heading — and it
      # takes the next release down with it, since the entry that should have
      # gone under [Unreleased] left it empty.
      - name: Changelog untouched
        run: make check-changelog

  # ---------------------------------------------------------------- Go suite
  #
  # Sharded because the race detector makes this the long pole. The split
  # follows measured cost: daemon (the slowest single package), drops (56
  # connector packages), engine (plus the tests/ trees that drive a whole
  # stack), and rest (dominated by auth's bcrypt work). `rest` is the
  # complement so a new top-level package is never silently unrun.
  test:
    name: Go race suite (${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    strategy:
      # One shard failing must not cancel the others: which suites also break is
      # most of the diagnosis, and cancelling hides it.
      fail-fast: false
      matrix:
        shard:
          - name: daemon
            pkgs: ./daemon/...
          - name: drops
            pkgs: ./drops/...
          - name: engine
            pkgs: ./engine/... ./tests/...
          - name: rest
            pkgs: ""
    services:
      # Service containers replace the hand-rolled initdb / mariadb-install-db
      # tasks. Same users, databases and ports the manifest created by hand.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dazyflow
          POSTGRES_PASSWORD: dazyflow
          POSTGRES_DB: dazyflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dazyflow -d dazyflow_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: dazyflow_test
          MARIADB_USER: dazyflow
          MARIADB_PASSWORD: dazyflow
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test (race)
        # The race detector pushes the daemon package past Go's default
        # 10-minute per-package ceiling. The limit is per package, so this is
        # headroom for the slowest one, not a slow-suite allowance.
        run: |
          if [ -n '${{ matrix.shard.pkgs }}' ]; then
            read -ra PKGS <<< '${{ matrix.shard.pkgs }}'
          else
            # The complement of the named shards above.
            mapfile -t PKGS < <(go list ./... | grep -vE '/(daemon|drops|engine|tests)(/|$)')
          fi
          echo "shard covers ${#PKGS[@]} packages"
          go test -race -timeout 30m "${PKGS[@]}"

  # ---------------------------------------------------------------- end-to-end
  #
  # Its own job: these need only Postgres and a Go toolchain, so they run in
  # parallel with the race suite. All three pipeline demos run, since they are
  # the only thing exercising dzd end-to-end through its CLI and HTTP surfaces
  # and unrun demos rot. ap-invoice starts its own Postgres on :55432, which
  # does not collide with the service container below.
  e2e:
    name: dzctl end-to-end
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dazyflow
          POSTGRES_PASSWORD: dazyflow
          POSTGRES_DB: dazyflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dazyflow -d dazyflow_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: dzctl end-to-end
        run: |
          bash tests/e2e/csv-pipeline/run.sh
          bash tests/e2e/mcp-pipeline/run.sh
          bash tests/e2e/ap-invoice/run.sh

  # ------------------------------------------------------------------ web app
  web:
    name: Web unit tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The docs SPA content tree (web/src/docs/content/) is generated, not
      # committed — guide pages copied from docs/guide/ and the step catalog
      # emitted by cmd/docsgen — so it needs Go here even though this job is
      # otherwise pure Node. Without it content.ts globs an empty directory and
      # the docs-search tests fail on a fresh checkout with "Nothing matches",
      # which reads as a search bug rather than as missing content.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      # The JS half of the supply chain: gate on what SHIPS. `--omit=dev`
      # because the dev server and vitest UI do not exist in the bundle, and
      # auditing them keeps this permanently red with no remedy (Dependabot
      # still opens PRs for them). `--audit-level=high` because react-router 6.x
      # is flagged for an open redirect this app blocks by hand (`return_to`
      # validation in SignIn.tsx, mirroring daemon/google_signin.go) and an SSR
      # issue a client-only SPA cannot reach.
      - name: npm audit (shipped dependencies)
        run: npm audit --audit-level=high --omit=dev
        working-directory: web

      - name: Generate docs content
        run: make docs-content

      # `npm run build` is `tsc -b && vite build`, so a type error fails there —
      # but it does NOT run the unit tests, which left the whole vitest suite
      # (error explainers, port typing, the Swedish catalog vocabulary and its
      # drift guards) unrun in CI, free to rot unnoticed. `npm test` is
      # `vitest run`.
      - run: npm test
        working-directory: web

      - run: npm run build
        working-directory: web

  # --------------------------------------------------------------- docs site
  docs:
    name: Docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Builds docs.dazyflow.app so the published docs cannot drift from the
      # code: `make docs-site` regenerates the step catalog from the live drop
      # manifests (go run ./cmd/docsgen) and Vite-builds the docs SPA. A broken
      # manifest, a bad docsgen change, a type error or a broken guide page fails
      # here. Generated content and dist are git-ignored.
      - name: Build docs site
        run: make docs-site

  # ------------------------------------------------------- supply chain gates
  security:
    name: Vulnerability scan and SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # `stable` rather than go-version-file: the scan's Go version decides which
      # STDLIB govulncheck audits, and pinning made every stdlib CVE batch turn
      # this red until go.mod was hand-bumped. Build jobs and images stay pinned.
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: go.sum

      # Two passes with complementary blind spots: SOURCE (`./...`) covers every
      # package in the module; BINARY (-mode binary) covers what ships and catches
      # vulnerable symbols reached through interfaces that the SSA walk misses
      # (otel baggage parsing via the global propagator was one). Keep BOTH at
      # symbol granularity: at module granularity an advisory with no fixed
      # version is reported unconditionally and CI goes permanently red.
      # If this step ever reports `Killed` with no output, that is the OOM
      # killer (source mode peaks near 4 GiB on a cold cache), not a finding.
      - name: govulncheck (source and binary)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          GV="$(go env GOPATH)/bin/govulncheck"
          "$GV" ./...
          # Symbol scan of each shipped binary. docsgen is a build-time tool,
          # not shipped, so it is deliberately out of scope.
          mkdir -p /tmp/vulnbin
          for c in dzd dzctl dz-mcp; do
            go build -o "/tmp/vulnbin/$c" "./cmd/$c"
            echo "--- govulncheck -mode binary $c"
            "$GV" -mode binary "/tmp/vulnbin/$c"
          done

      # Software Bill of Materials (A.8.25 / A.8.29 supply chain). syft scans the
      # Go module graph and emits SPDX + CycloneDX JSON. CI guarantees the SBOM
      # always generates; releases attach both. Not committed — see .gitignore.
      - name: Generate SBOM
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin"
          "$(go env GOPATH)/bin/syft" dir:. \
            -o spdx-json=sbom.spdx.json \
            -o cyclonedx-json=sbom.cdx.json

      # The sourcehut build left these on the build page. Here they are a proper
      # artifact, so a release can attach them without a rebuild.
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: |
            sbom.spdx.json
            sbom.cdx.json
          if-no-files-found: error

  # --------------------------------------------------------- images + deploy
  #
  # Deliberately NO `needs:`: building both images on every run is the only
  # thing exercising the Dockerfiles, and doing it in parallel keeps it inside
  # max(test, web, docs, security) instead of after it. Publishing stays gated
  # in the `publish` job, the only place a built image reaches ghcr.io.
  images:
    name: Images
    runs-on: ubuntu-latest
    env:
      # Lower-cased below: ghcr rejects an uppercase path segment, and a GitHub
      # login may legitimately contain capitals.
      OWNER: ${{ github.repository_owner }}
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      ver: ${{ steps.ver.outputs.ver }}
      owner: ${{ steps.ver.outputs.owner }}
      commit: ${{ steps.ver.outputs.commit }}
      date: ${{ steps.ver.outputs.date }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # `git describe --tags` for the version stamp

      # Building here is also what stops the 1-vCPU production droplet compiling
      # its own releases. The outputs hand these values to `publish` so the
      # stamping rules live in one place.
      - name: Resolve version
        id: ver
        run: |
          TAG=$(git describe --exact-match --tags HEAD 2>/dev/null || true)
          echo "tag=$TAG"                      >> "$GITHUB_OUTPUT"
          echo "ver=${TAG:-ci}"                >> "$GITHUB_OUTPUT"
          echo "owner=${OWNER,,}"              >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"  >> "$GITHUB_OUTPUT"
          if [ -z "$TAG" ]; then
            echo "::notice::HEAD is not a tag — images will be stamped from ./VERSION"
          fi

      # Both Dockerfiles already carry `--mount=type=cache` for the Go module and
      # build caches, but a BuildKit cache mount is local to the daemon and a
      # hosted runner starts with an empty one — so every run recompiled the
      # world. buildx with the GitHub Actions cache backend is what makes those
      # mounts, and the layer cache, survive between runs.
      - uses: docker/setup-buildx-action@v4

      # VERSION is $TAG, which is EMPTY off a tag: the Dockerfile falls back to
      # the committed ./VERSION when the arg is empty, and a placeholder would
      # shadow that fallback. COMMIT has no fallback (ARG COMMIT=unknown), so it
      # must be passed for a binary to be traceable.
      #
      # Separate cache scopes so the two images do not evict each other's
      # layers; mode=max keeps the intermediate stages (npm ci, go build).
      - name: Build dzd image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: dazyflow-dzd:${{ steps.ver.outputs.ver }}
          build-args: |
            VERSION=${{ steps.ver.outputs.tag }}
            COMMIT=${{ steps.ver.outputs.commit }}
            BUILD_DATE=${{ steps.ver.outputs.date }}
          cache-from: type=gha,scope=dzd
          cache-to: type=gha,mode=max,scope=dzd

      # The docs site image (docs.dazyflow.app) — deploy/ references it but
      # nothing else exercises Dockerfile.docs.
      - name: Build docs image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.docs
          push: false
          tags: dazyflow-docs:${{ steps.ver.outputs.ver }}
          cache-from: type=gha,scope=docs
          cache-to: type=gha,mode=max,scope=docs

  # ------------------------------------------------------------------ publish
  #
  # Nothing reaches ghcr.io until the Go suite, the web suite, the docs site and
  # the supply-chain scans are green. It rebuilds rather than receiving an image
  # artifact: a buildx cache hit from the same run costs seconds.
  publish:
    name: Publish images
    runs-on: ubuntu-latest
    # A version tag publishes automatically; the dispatch input is the manual
    # escape hatch for re-publishing an image without touching production.
    if: startsWith(github.ref, 'refs/tags/') || inputs.publish
    needs: [gates, test, e2e, web, docs, security, images]
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      VER: ${{ needs.images.outputs.ver }}
      TAG: ${{ needs.images.outputs.tag }}
    steps:
      # A shallow clone is enough here, unlike in `images`: the version stamp
      # arrives through needs.images.outputs, so nothing in this job runs
      # `git describe`.
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Every release is published twice: under its own version, which is what
      # `make upgrade` pins, and as :latest, so a bare `docker compose pull` with
      # no VERSION set still lands on the newest release rather than on nothing.
      # See the image: lines in docker-compose.prod.yml.
      #
      # :latest only moves for a tagged build. Publishing an untagged run would
      # otherwise point production's floating tag at an arbitrary commit.
      - name: Resolve tags
        id: tags
        run: |
          BASE='${{ env.REGISTRY }}/${{ needs.images.outputs.owner }}'
          for img in dzd docs; do
            list="$BASE/dazyflow-$img:$VER"
            if [ -n "$TAG" ]; then
              list="$list,$BASE/dazyflow-$img:latest"
            fi
            echo "$img=$list" >> "$GITHUB_OUTPUT"
          done
          if [ -z "$TAG" ]; then
            echo "::warning::untagged build — pushing :$VER but not moving :latest"
          fi

      - name: Push dzd image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.dzd }}
          build-args: |
            VERSION=${{ needs.images.outputs.tag }}
            COMMIT=${{ needs.images.outputs.commit }}
            BUILD_DATE=${{ needs.images.outputs.date }}
          cache-from: type=gha,scope=dzd

      - name: Push docs image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.docs
          push: true
          tags: ${{ steps.tags.outputs.docs }}
          cache-from: type=gha,scope=docs

      # Ask Dazyflow to deploy what was just published.
      #
      # A PUSHED VERSION TAG IS THE ONLY THING THAT DEPLOYS. Not master, not a
      # PR, not a dispatch (even from the tag ref). A missing secret FAILS rather
      # than skipping: a silent skip is the "green build that shipped nothing"
      # this setup exists to prevent.
      #
      # No `curl -f`: it discards the body, and the endpoint answers every
      # pre-authentication failure with an identical 401 on purpose, so the body
      # plus the checklist below is all a reader gets. Both secrets are
      # shape-checked first because a paste artifact (quotes kept, or a whole
      # KEY=value line) is otherwise indistinguishable from a rotated key.
      # Neither check echoes a value.
      - name: Trigger deploy
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          DAZYFLOW_WEBHOOK_KEY: ${{ secrets.DAZYFLOW_WEBHOOK_KEY }}
          DAZYFLOW_FLOW: ${{ secrets.DAZYFLOW_FLOW }}
          VER: ${{ needs.images.outputs.ver }}
        run: |
          if [ -z "$DAZYFLOW_WEBHOOK_KEY" ] || [ -z "$DAZYFLOW_FLOW" ]; then
            echo "::error::tag ${{ github.ref_name }} pushed but DAZYFLOW_WEBHOOK_KEY / DAZYFLOW_FLOW are not set — images published, NOT deployed"
            exit 1
          fi

          # Surrounding whitespace is stripped rather than rejected: the server's
          # bearer parser trims the token (daemon/webhook.go stripBearer), so a
          # value carrying a stray newline works today and must keep working.
          # What is left after trimming has to be usable verbatim.
          trim() { printf '%s' "$1" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          KEY=$(trim "$DAZYFLOW_WEBHOOK_KEY")
          FLOW=$(trim "$DAZYFLOW_FLOW")

          # The endpoint wants exactly <tenant>/<workspace>/<flow-id>; anything
          # else is a 400 whose body we would only see after the request. The
          # segment count is safe to print, the value is not.
          segs=$(printf '%s' "$FLOW" | awk -F/ '{print NF}')
          case "$FLOW" in
            /*|*/|*//*|DAZYFLOW_FLOW=*|*[\"\']*|*[[:space:]]*) segs=bad ;;
          esac
          if [ "$segs" != 3 ]; then
            echo "::error::DAZYFLOW_FLOW must be exactly <tenant>/<workspace>/<flow-id> with no quotes, spaces or leading/trailing slash (got $segs segment(s))"
            exit 1
          fi

          case "$KEY" in
            DAZYFLOW_WEBHOOK_KEY=*|*[\"\']*|*[[:space:]]*)
              echo "::error::DAZYFLOW_WEBHOOK_KEY is not a bare key — it is quoted, contains whitespace, or is a whole shell assignment. Store just the key value."
              exit 1 ;;
          esac

          out="$RUNNER_TEMP/deploy-trigger.body"
          code=$(curl -sS -o "$out" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" \
            -d "{\"version\":\"$VER\"}" \
            "https://dazyflow.app/trigger/$FLOW") || {
            echo "::error::deploy trigger could not reach dazyflow.app for $VER — images published, NOT deployed"
            exit 1
          }
          body=$(head -c 2000 "$out")

          case "$code" in
            2*)
              # 202 + {"job_id": "..."} — the run id is worth keeping in the log.
              echo "deploy triggered for $VER (HTTP $code) $body"
              exit 0 ;;
            401)
              echo "::error::deploy trigger REFUSED for $VER (HTTP 401) — images published, NOT deployed"
              echo "server said: $body"
              echo "The endpoint answers every pre-auth failure identically, so check all four:"
              echo "  1. DAZYFLOW_WEBHOOK_KEY no longer matches a key on the flow's webhook step."
              echo "  2. DAZYFLOW_FLOW names a tenant/workspace/flow that does not exist."
              echo "  3. The flow is not published. /trigger fires the PUBLISHED revision, never"
              echo "     the draft — a key rotated in the editor and left unpublished still shows"
              echo "     as correct in the UI and still 401s here."
              echo "  4. The webhook step carries no secrets at all."
              echo "The live key is the one on the published revision:"
              echo "  GET /api/v1/me/flows/<flow-id>/published        -> published, published_commit, dirty"
              echo "  GET /api/v1/me/flows/<flow-id>?ref=<commit>     -> .nodes[] webhook_input .params.secrets"
              exit 1 ;;
            403)
              # Past auth: the body names the reason (flow_disabled /
              # trigger_disabled), and both are fixed in the app, not in CI.
              echo "::error::deploy trigger authenticated but was rejected for $VER (HTTP 403) — images published, NOT deployed"
              echo "server said: $body"
              exit 1 ;;
            *)
              echo "::error::deploy trigger failed for $VER (HTTP $code) — images published, NOT deployed"
              echo "server said: $body"
              exit 1 ;;
          esac
