syntax = "proto3";

package dazyflow.control.v1;

option go_package = "git.sr.ht/~klahr/dazyflow/api/gen/control;controlpb";

// The control plane is what dzctl (and any future web UI) speaks to dzd
// for graph/job/module/workspace management. Authentication is per-RPC
// via "authorization: Bearer <token>" gRPC metadata, validated by the
// daemon's auth.Authenticator.

// ============================================================ messages

message Node {
    string id     = 1;
    string module = 2;
    bytes  params = 3; // JSON
    map<string, string> env = 4;
}

message Edge {
    string from      = 1;
    string from_port = 2;
    string to        = 3;
    string to_port   = 4;
    string on_error  = 5;
}

message Graph {
    string id        = 1;
    string version   = 2;
    string tenant    = 3;
    string workspace = 4;
    repeated Node nodes = 5;
    repeated Edge edges = 6;
    repeated GraphTrigger triggers = 7;
}

message GraphTrigger {
    string type   = 1; // "cron", "poll", or "webhook"
    string cron   = 2;
    string secret = 3;
    int32  interval_seconds = 4; // for type=poll; seconds between fires
}

message GraphProgress {
    string job_id  = 1;
    string node_id = 2;
    double percent = 3;
    string message = 4;
}

message JobError {
    string code    = 1;
    string message = 2;
}

message NodeResult {
    string node_id = 1;
    string status  = 2;
    JobError error = 3;
}

message GraphResult {
    string graph_id = 1;
    string status   = 2;
    repeated NodeResult nodes = 3;
    JobError error = 4;
}

message Port {
    string id        = 1;
    repeated string mime = 2;
    string label     = 3;
    bool   required  = 4;
    bool   variadic  = 5;
    int32  min       = 6;
    int32  max       = 7;
}

message Manifest {
    string id              = 1;
    string version         = 2;
    string label           = 3;
    string color           = 4;
    string execution_model = 5;
    string process_model   = 6;
    repeated Port inputs   = 7;
    repeated Port outputs  = 8;
    bool   idempotent      = 9;
    string retry_policy    = 10;
    // Discovery metadata
    string category        = 11;
    string provider        = 12;
    repeated string tags   = 13;
    string description     = 14;
}

message JobRecord {
    string id          = 1;
    string graph_id    = 2;
    string node_id     = 3;
    string tenant      = 4;
    string workspace   = 5;
    string status      = 6;
    int64  enqueued_at = 7; // unix nanos
    int64  started_at  = 8;
    int64  finished_at = 9;
    int32  attempt     = 10;
    string worker_id   = 11;
    JobError error     = 12;
}

// =========================================================== GraphService

service GraphService {
    rpc SaveGraph    (SaveGraphRequest)    returns (SaveGraphResponse);
    rpc LoadGraph    (LoadGraphRequest)    returns (LoadGraphResponse);
    rpc ListGraphs   (ListGraphsRequest)   returns (ListGraphsResponse);
    rpc PromoteGraph (PromoteGraphRequest) returns (PromoteGraphResponse);
    rpc RunGraph     (RunGraphRequest)     returns (stream RunGraphEvent);
}

message SaveGraphRequest  { Graph graph = 1; }
message SaveGraphResponse { string commit = 1; }

message LoadGraphRequest {
    string tenant    = 1;
    string workspace = 2;
    string graph_id  = 3;
    string ref       = 4; // empty = HEAD
}
message LoadGraphResponse { Graph graph = 1; }

message ListGraphsRequest {
    string tenant    = 1;
    string workspace = 2;
}
message ListGraphsResponse { repeated string graph_ids = 1; }

message PromoteGraphRequest {
    string tenant    = 1;
    string workspace = 2;
    string graph_id  = 3;
    string env       = 4;
    string commit    = 5;
}
message PromoteGraphResponse {}

message RunGraphRequest {
    // Either inline graph or load by ref.
    Graph  graph     = 1;
    string tenant    = 2;
    string workspace = 3;
    string graph_id  = 4;
    string ref       = 5;
}

message RunGraphEvent {
    oneof payload {
        GraphProgress progress = 1;
        RunGraphCompleted completed = 2;
    }
}

message RunGraphCompleted {
    string job_id = 1;
    GraphResult result = 2;
}

// ============================================================ JobService

service JobService {
    rpc GetJob           (GetJobRequest)           returns (JobRecord);
    rpc ListJobsForGraph (ListJobsForGraphRequest) returns (ListJobsResponse);
    // CancelJob aborts an in-flight graph run. The caller must have
    // graph:run on the run's tenant. The graph and every non-terminal
    // node transition to JobStatus.Cancelled. Idempotent — cancelling a
    // run that's already terminal returns NotFound or ConflictError.
    rpc CancelJob       (CancelJobRequest)        returns (CancelJobResponse);
    // StreamJobLogs replays a run's persisted log (progress lines, node
    // status transitions, the terminal outcome) and, with follow=true,
    // keeps streaming live events until the run terminates. after_seq
    // resumes from a cursor (0 = from the start). The caller must belong
    // to the run's tenant.
    rpc StreamJobLogs   (StreamJobLogsRequest)    returns (stream JobLogEntry);
}

message GetJobRequest           { string job_id = 1; }
message ListJobsForGraphRequest { string graph_id = 1; }
message ListJobsResponse        { repeated JobRecord jobs = 1; }
message CancelJobRequest  {
    string job_id = 1; // the graph-run ID; node-jobs are cancelled with their parent
    string reason = 2; // free-text, recorded on the run; empty defaults to "cancelled by user"
}
message CancelJobResponse {}
message StreamJobLogsRequest {
    string job_id    = 1; // the graph-run ID
    bool   follow    = 2; // keep streaming live events until terminal
    int64  after_seq = 3; // resume cursor; 0 = from the beginning
}
message JobLogEntry {
    int64  seq     = 1; // resume cursor for the next request
    string ts      = 2; // RFC3339
    string node_id = 3; // empty on run-level lines (terminal, truncated)
    string kind    = 4; // progress | status | terminal | truncated
    string message = 5;
    string stream  = 6; // stdout | stderr on labelled progress lines, else empty
}

// ========================================================= DropService

service DropService {
    rpc ListDrops (ListDropsRequest) returns (ListDropsResponse);
}

message ListDropsRequest {
    // query substring-matches against id, label, and description.
    // Empty = no full-text filter.
    string query = 1;
    // Each filter is OR-within (any value matches) and AND-across-fields
    // (categories AND providers AND tags must all pass).
    repeated string categories = 2;
    repeated string providers  = 3;
    repeated string tags       = 4;
}
message ListDropsResponse { repeated Manifest drops = 1; }
