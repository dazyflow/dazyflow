syntax = "proto3";

package dazyflow.node.v1;

option go_package = "git.sr.ht/~klahr/dazyflow/api/gen/node;nodepb";

// NodeService is the contract every RemoteTransport speaks. A remote module
// implements this server-side; the engine talks to it as a client via
// engine.RemoteTransport.
service NodeService {
    // ListManifests returns every drop this runner serves.
    //
    // Plural from the outset, even though a runner that serves one drop just
    // returns a single entry. Changing the shape later would mean every runner
    // already written has to be updated in lockstep with the daemon — and the
    // point of a runner is that its binary is not the daemon's to update.
    rpc ListManifests (ListManifestsRequest) returns (ListManifestsResponse);
    rpc Execute       (Job)                  returns (stream Event);
}

message ListManifestsRequest {}

message ListManifestsResponse {
    repeated Manifest manifests = 1;
}

message Port {
    string id        = 1;
    repeated string mime = 2;
    string label     = 3;
    bool   required  = 4;
    bool   variadic  = 5;
    int32  min       = 6; // 0 means unset (no minimum)
    int32  max       = 7; // 0 means unset (no maximum)
}

message Manifest {
    string id                = 1;
    string version           = 2;
    string label             = 3;
    string color             = 4;
    string execution_model   = 5;
    string process_model     = 6;
    repeated Port inputs     = 7;
    repeated Port outputs    = 8;
    bytes  params_schema     = 9; // raw JSON
    bool   idempotent        = 10;
    string retry_policy      = 11;
    repeated string compatible_with = 12;

    // Presentation. Without these a runner's step lands in the palette with a
    // generic box icon, no grouping, and nothing for search to match on but
    // its id — so they are part of the contract from the start rather than
    // added once runners exist in the wild.
    string icon              = 13; // a name from the shared icon set
    string category          = 14; // groups it in the palette; see the docs
    string subtitle          = 15; // one line under the label
    string description       = 16; // what it does, for the inspector
    string summary           = 17; // one sentence, for lists and search
    repeated string tags     = 18; // words someone might search for
}

message Ref {
    string mime   = 1;
    string ref    = 2;   // file path or URI
    bytes  inline = 3;   // small inline payload, JSON-encoded
}

message Job {
    string job_id   = 1;
    string graph_id = 2;
    string node_id  = 3;
    string trace_id = 4;
    string span_id  = 5;
    map<string, Ref> input  = 6;
    bytes  params           = 7; // JSON
    map<string, string> env = 8;
    string cleanup          = 9;
    // Which of the runner's drops to execute. A runner serving one drop can
    // ignore it; a runner serving several has no other way to tell, since a
    // job otherwise names only the graph and node it came from.
    string drop_id          = 10;
}

message Progress {
    string job_id  = 1;
    string node_id = 2;
    double percent = 3;
    string message = 4;
    bytes  data    = 5; // JSON
}

message JobError {
    string code    = 1;
    string message = 2;
}

message Result {
    string job_id = 1;
    string status = 2; // "ok" | "error"
    map<string, Ref> output = 3;
    JobError error = 4;
}

message Event {
    oneof payload {
        Progress progress = 1;
        Result   result   = 2;
    }
}
