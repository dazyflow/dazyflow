# Durable single-node Hazy Flow: the daemon + Postgres.
#
#   export HAZYFLOW_MASTER_KEY=$(openssl rand -base64 32)
#   docker compose -f deploy/docker-compose.yml up --build
#
# The daemon serves the API + web bundle on http://localhost:8080 and gRPC
# on :50050. Control-plane state (jobs, keys, sessions, users, encrypted
# secrets) persists to Postgres; graphs + sandboxes persist to the hzddata
# volume. Keep HAZYFLOW_MASTER_KEY safe — losing it makes stored secrets
# undecryptable (see SECURITY.md / DEPLOY.md).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hazyflow
      POSTGRES_PASSWORD: hazyflow
      POSTGRES_DB: hazyflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hazyflow -d hazyflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  hzd:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HAZYFLOW_POSTGRES_DSN: postgres://hazyflow:hazyflow@postgres:5432/hazyflow?sslmode=disable
      # Required — fail fast if unset rather than booting with secrets disabled.
      HAZYFLOW_MASTER_KEY: ${HAZYFLOW_MASTER_KEY:?set HAZYFLOW_MASTER_KEY, e.g. openssl rand -base64 32}
      HAZYFLOW_ENABLE_METRICS: "1"
      # Uncomment to export traces to an OTel collector:
      # OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    command:
      - --http=:8080
      - --web-dist=/srv/web
      - --workspace-dir=/data/workspace
      - --sandbox-base=/data/sandbox
      - --web-origin=http://localhost:8080
      - --metrics
    ports:
      - "8080:8080"
    volumes:
      - hzddata:/data
    # No container healthcheck: the distroless image ships no shell/curl.
    # Use the daemon's HTTP /healthz + /readyz (or the gRPC health service)
    # from your orchestrator instead — see deploy/k8s/hazyflow.yaml.

volumes:
  pgdata:
  hzddata:
