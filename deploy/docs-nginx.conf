# nginx config for the docs.dazyflow.app static site (see Dockerfile.docs).
# The main Caddy terminates TLS and reverse-proxies to this container on :80.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # VitePress is built with cleanUrls: true — pages are emitted as *.html on
    # disk but linked WITHOUT the extension. Resolve /guide/concepts →
    # /guide/concepts.html, a directory → its index.html, else a real 404 that
    # renders VitePress's own 404 page.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed asset bundles are content-addressed — cache them hard. HTML is not
    # hashed, so it keeps nginx's default revalidation.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
