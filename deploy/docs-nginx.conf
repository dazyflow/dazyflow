# nginx config for the docs.dazyflow.app SPA (see Dockerfile.docs). The main
# Caddy terminates TLS and reverse-proxies to this container on :80.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The docs are a React single-page app (client-side routing). Serve the
    # requested file if it exists (assets), otherwise fall back to index.html so
    # deep links like /reference/steps/klarna boot the SPA at that route.
    location / {
        try_files $uri /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed asset bundles are content-addressed — cache them hard. index.html is
    # not hashed, so it keeps nginx's default revalidation.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
