# Kubernetes manifest for a SINGLE-POD Hazyflow deployment — the simplest
# possible start: one replica, no load balancer, no ingress. Reach the UI with
#
#   kubectl port-forward deploy/hazyflow 8080:8080
#
# then open http://localhost:8080.
#
# Assumes an EXTERNAL/managed Postgres (e.g. DigitalOcean Managed Postgres)
# referenced via the Secret below. Apply with:
#
#   kubectl apply -k deploy/k8s/      (or: kubectl apply -f deploy/k8s/hazyflow.yaml)
#
# Liveness uses /healthz (process up); readiness uses /readyz (pings Postgres)
# so the pod is marked NotReady when the DB is unreachable.
#
# When you outgrow one pod, deploy/k8s/ingress.yaml adds a public ingress +
# TLS, and you can scale the Deployment up — the app coordinates across
# replicas via Postgres (event bus + advisory-lock scheduler leader). See
# DEPLOY.md for the scale-up path and the extra resources (PDB/HPA/NetworkPolicy).
---
apiVersion: v1
kind: Secret
metadata:
  name: hazyflow-secrets
type: Opaque
stringData:
  # REPLACE both. master-key: openssl rand -base64 32 (keep a sealed backup —
  # losing it makes every stored secret undecryptable).
  HAZYFLOW_MASTER_KEY: "REPLACE_WITH_BASE64_32_BYTE_KEY"
  HAZYFLOW_POSTGRES_DSN: "postgres://USER:PASS@your-postgres-host:5432/hazyflow?sslmode=require"
---
# Flow graphs live in git repos on disk under /data (HAZYFLOW_DATA_DIR), NOT
# in Postgres — so /data MUST persist or a pod restart loses every flow. A
# ReadWriteOnce PVC is exactly right for a single pod; on DOKS the default
# do-block-storage StorageClass is RWO. 10Gi is plenty to start.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hazyflow-data
  labels: { app: hazyflow }
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
  # storageClassName: do-block-storage  # omit to use the cluster default (DOKS: do-block-storage)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hazyflow
  labels: { app: hazyflow }
spec:
  replicas: 1
  # The /data PVC is ReadWriteOnce, so a replacement pod can't attach the
  # volume while the old pod still holds it. Recreate terminates the old pod
  # first (a few seconds of downtime on each rollout) instead of deadlocking
  # on a multi-attach error, which the default RollingUpdate would.
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: hazyflow }
  template:
    metadata:
      labels: { app: hazyflow }
    spec:
      # Keep above HAZYFLOW_SHUTDOWN_GRACE (25s, below) so SIGTERM drains
      # in-flight nodes and finalizes their runs before the kubelet SIGKILLs.
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        # Matches the image's `hazyflow` user (Dockerfile: adduser -u 1000),
        # which owns /data. fsGroup makes the mounted /data PVC and /tmp
        # volume group-writable by the process.
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hzd
          image: hazyflow/hzd:latest # build + push from the repo Dockerfile
          # Container layout defaults (HAZYFLOW_HTTP / _WEB_DIST / _DATA_DIR)
          # come from the image's ENV. Everything else is operator policy.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true # only the /data + /tmp volumes are writable
            capabilities:
              drop: [ALL]
          env:
            # Reached directly via port-forward (no TLS-terminating proxy), so
            # do NOT set HAZYFLOW_TRUST_PROXY_HEADERS — a client could spoof
            # X-Forwarded-Proto otherwise. The origins are the port-forward
            # URL; change all three (add TRUST_PROXY_HEADERS=1) once you front
            # it with a real hostname + TLS via ingress.yaml.
            - { name: HAZYFLOW_WEB_ORIGIN,      value: "http://localhost:8080" }
            - { name: HAZYFLOW_PUBLIC_BASE_URL, value: "http://localhost:8080" }
            # Drain in-flight work on SIGTERM; keep < terminationGracePeriodSeconds.
            - { name: HAZYFLOW_SHUTDOWN_GRACE,  value: "25s" }
          envFrom:
            - secretRef: { name: hazyflow-secrets }
          ports:
            - { name: http, containerPort: 8080 }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hazyflow-data
        # readOnlyRootFilesystem needs a writable /tmp for transient scratch
        # (go-git, TLS, etc.).
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: hazyflow
  labels: { app: hazyflow }
spec:
  # ClusterIP is enough — reach it with `kubectl port-forward`. Switch to an
  # ingress (deploy/k8s/ingress.yaml) when you want public access + TLS.
  selector: { app: hazyflow }
  ports:
    - { name: http, port: 8080, targetPort: http }
