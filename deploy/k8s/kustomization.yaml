# Kustomize entrypoint tying the Dazyflow manifests together.
#
#   kubectl apply -k deploy/k8s/        # both files, one command
#   kubectl kustomize deploy/k8s/       # render to stdout without applying
#
# This is a thin base: it just composes the two manifests. Override the
# image, target namespace, and secrets per-environment with the commented
# blocks below or (preferably) a separate overlay that points its own
# `resources: [../base]` at this directory.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - dazyflow.yaml
  # Single-pod start has no public ingress. When you front it with a hostname
  # + TLS, uncomment this (see ingress.yaml and DEPLOY.md "Scaling up").
  # - ingress.yaml
  # Multi-replica scale-up (PodDisruptionBudget + HPA + NetworkPolicy). Read
  # scale-up.yaml's header first — it needs RWX storage for /data and the
  # RollingUpdate patch below before replicas are safe.
  # - scale-up.yaml

# Pin the image here instead of editing dazyflow.yaml, so the same base
# serves every environment. Set newName to your DO Container Registry path
# and newTag to the build you're rolling out.
#
# images:
#   - name: dazyflow/dzd
#     newName: registry.digitalocean.com/<you>/dzd
#     newTag: "v1.2.3"

# Deploy into a dedicated namespace (create it separately, or add a
# Namespace resource above). Leaving this unset uses the apply-time context.
#
# namespace: dazyflow

# Prefer generating the Secret from a real source over the inline template in
# dazyflow.yaml. Drop the Secret block from dazyflow.yaml and uncomment this,
# or wire in Sealed Secrets / External Secrets / SOPS for production.
#
# secretGenerator:
#   - name: dazyflow-secrets
#     behavior: replace          # supersede the inline Secret
#     envs:
#       - dazyflow.env           # KEY=VALUE lines, git-ignored
# generatorOptions:
#   disableNameSuffixHash: true  # keep the name `dazyflow-secrets` stable

# Multi-replica patch (pair with `- scale-up.yaml` above). Switches the base
# from single-pod Recreate to RollingUpdate and hands replica count to the HPA.
# Requires RWX /data storage first (see scale-up.yaml). The null replicas
# removes the static count so the HPA owns it.
#
# patches:
#   - target: { kind: Deployment, name: dazyflow }
#     patch: |
#       - { op: remove, path: /spec/replicas }
#       - { op: replace, path: /spec/strategy, value: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } } }
