image: archlinux
packages:
  - go
  - nodejs
  - npm
  - postgresql
  - podman
secrets:
  - 6a3daa36-3866-48d4-8846-ecfa57a0d0dd
sources:
  - git@git.sr.ht:~klahr/hazyflow
environment:
  HAZYFLOW_TEST_DB: postgres://hazyflow:hazyflow@localhost:5432/hazyflow_test
tasks:
  - postgres: |
      sudo -iu postgres initdb -D /var/lib/postgres/data
      sudo install -d -o postgres -g postgres /run/postgresql
      sudo -iu postgres pg_ctl -D /var/lib/postgres/data -l /tmp/pg.log -o "-p 5432" -w start \
        || { echo "=== pg.log ==="; cat /tmp/pg.log; exit 1; }
      for i in $(seq 1 30); do pg_isready -h localhost -p 5432 && break; sleep 1; done
      sudo -iu postgres psql -c "CREATE USER hazyflow WITH PASSWORD 'hazyflow';"
      sudo -iu postgres psql -c "CREATE DATABASE hazyflow_test OWNER hazyflow;"
  - build: |
      cd hazyflow
      go build ./...
  - test: |
      cd hazyflow
      go test -race ./...
  - vet: |
      cd hazyflow
      go vet ./...
  - vuln: |
      cd hazyflow
      go install golang.org/x/vuln/cmd/govulncheck@latest
      "$(go env GOPATH)/bin/govulncheck" ./...
  - hzctl-e2e: |
      cd hazyflow
      bash examples/csv-pipeline/run.sh
  - web: |
      cd hazyflow/web
      npm ci
      npm run build
  # Confirm the deployable image actually builds — deploy/ references it
  # but nothing exercised the Dockerfile until now. Rootless podman, no
  # daemon needed in the build VM. Not pushed anywhere; releases tag and
  # push by hand (see deploy/README.md).
  - docker-image: |
      cd hazyflow
      podman build -t hazyflow/hzd:ci .

triggers:
  - action: email
    condition: failure
    to: klahr@r8.rs
