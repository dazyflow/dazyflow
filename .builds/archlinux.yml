image: archlinux
packages:
  - go
  - nodejs
  - npm
  - python
  - postgresql
  - mariadb
  - podman
secrets:
  - 6a3daa36-3866-48d4-8846-ecfa57a0d0dd
  # File secret -> ~/.registry-credentials, holding REGISTRY_USER and
  # REGISTRY_PASSWORD for registry.dazyflow.app (see the docker-image task).
  # Without it, tag builds still pass — they just skip publishing, so a missing
  # or revoked secret shows up as a green build that quietly shipped nothing.
  # Check the task's last line on a release build, not just the build colour.
  - c61a6a1c-39f4-47c8-b727-00b465992ded
  # File secret -> ~/.dazyflow-webhook, holding DAZYFLOW_WEBHOOK_KEY and
  # DAZYFLOW_FLOW. Lets a published release ask Dazyflow to deploy itself.
  - 218604bf-075c-44bd-b624-3c8a81825d81
sources:
  - git@git.sr.ht:~klahr/dazyflow
# Test databases. The bulk of the suite's integration tests skip unless these
# are set (Postgres-gated tests check DAZYFLOW_TEST_DB; the drops/db MySQL
# tests check DAZYFLOW_TEST_MYSQL; the live-DSN verify check uses DZ_TEST_PG_DSN).
# The postgres/mysql tasks below stand up local servers these point at, so CI
# runs the same tests a developer gets with both databases available — nothing
# silently skips.
environment:
  DAZYFLOW_TEST_DB: postgres://dazyflow:dazyflow@localhost:5432/dazyflow_test
  DAZYFLOW_TEST_MYSQL: dazyflow:dazyflow@tcp(localhost:3306)/dazyflow_test?parseTime=true
  DZ_TEST_PG_DSN: postgres://dazyflow:dazyflow@localhost:5432/dazyflow_test?sslmode=disable
tasks:
  - postgres: |
      sudo -iu postgres initdb -D /var/lib/postgres/data
      sudo install -d -o postgres -g postgres /run/postgresql
      sudo -iu postgres pg_ctl -D /var/lib/postgres/data -l /tmp/pg.log -o "-p 5432" -w start \
        || { echo "=== pg.log ==="; cat /tmp/pg.log; exit 1; }
      for i in $(seq 1 30); do pg_isready -h localhost -p 5432 && break; sleep 1; done
      sudo -iu postgres psql -c "CREATE USER dazyflow WITH PASSWORD 'dazyflow';"
      sudo -iu postgres psql -c "CREATE DATABASE dazyflow_test OWNER dazyflow;"
  # MariaDB for the drops/db MySQL-gated tests (DAZYFLOW_TEST_MYSQL). Mirrors
  # the postgres task: init a data dir, start the server on 127.0.0.1:3306, wait
  # for it, then create the dazyflow user + dazyflow_test database. The CREATE
  # statements run as the root@localhost unix_socket account (sudo mariadb over
  # the socket); the app connects as dazyflow over TCP with a password.
  - mysql: |
      sudo install -d -o mysql -g mysql /run/mysqld
      sudo mariadb-install-db --user=mysql --basedir=/usr --datadir=/var/lib/mysql >/tmp/mysql-install.log 2>&1 \
        || { echo "=== mysql-install.log ==="; cat /tmp/mysql-install.log; exit 1; }
      # setsid + nohup so the daemon detaches from this task's shell and
      # survives into the later build/test tasks (a bare `&` job can be reaped
      # at task boundaries; postgres above gets this for free via pg_ctl).
      # --skip-name-resolve is REQUIRED: a fresh MariaDB creates anonymous
      # ''@'localhost' rows, and without it a TCP connection to 127.0.0.1
      # reverse-resolves to "localhost" and matches that anonymous row instead
      # of 'dazyflow'@'%' → "Access denied". Skipping name resolution keeps the
      # peer as 127.0.0.1, which matches '%'. (Also faster, no DNS dependency.)
      sudo -u mysql setsid nohup /usr/bin/mariadbd --datadir=/var/lib/mysql --socket=/run/mysqld/mysqld.sock \
        --bind-address=127.0.0.1 --port=3306 --skip-name-resolve >/tmp/mysqld.log 2>&1 &
      for i in $(seq 1 30); do sudo mariadb --socket=/run/mysqld/mysqld.sock -e "SELECT 1" >/dev/null 2>&1 && break; sleep 1; done
      sudo mariadb --socket=/run/mysqld/mysqld.sock -e \
        "CREATE DATABASE dazyflow_test; CREATE USER 'dazyflow'@'%' IDENTIFIED BY 'dazyflow'; GRANT ALL PRIVILEGES ON dazyflow_test.* TO 'dazyflow'@'%'; FLUSH PRIVILEGES;" \
        || { echo "=== mysqld.log ==="; cat /tmp/mysqld.log; exit 1; }
  - build: |
      cd dazyflow
      go build ./...
  # The runner agent and runner.sh are Python and POSIX sh, so the Go suite
  # cannot see what they DO — it only checks that the embedded copies still
  # match the source (TestEmbeddedRunnerFilesMatchTheSource). Everything that
  # makes them trustworthy is in these unittest suites: a single-use token
  # refused before anything spends it, the registration token never reaching a
  # file, an allow-list surviving a reinstall, runner.env read rather than
  # evaluated, a service actually wired to start at boot. Unrun here, they would
  # rot unnoticed — the same trap the web task below documents. Runs before the
  # race suite because it takes seconds and this is the one script every
  # organisation pastes into a terminal.
  - runner: |
      cd dazyflow
      make runner-test
  - test: |
      cd dazyflow
      # The race detector pushes the daemon package past Go's default
      # 10-minute per-package ceiling; the limit is per package, so this is
      # headroom for the slowest one rather than a slow-suite allowance.
      go test -race -timeout 30m ./...
  - vet: |
      cd dazyflow
      go vet ./...
  # Vulnerability scan. Two passes, because they have complementary blind spots
  # and neither alone is enough:
  #
  #   1. SOURCE (`./...`) — widest coverage: every package in the module,
  #      including ones no shipped binary links.
  #   2. BINARY (-mode binary) — what actually ships. Source-mode reachability
  #      walks the SSA call graph from our packages and misses a vulnerable
  #      symbol invoked through an interface: GO-2026-5158 (otel baggage
  #      parsing) read as "not called" in source mode even though
  #      daemon/tracing.go registers propagation.Baggage{} and otel dispatches
  #      Extract through its global propagator on every traced request. The
  #      binary pass caught it. Also ~70 MiB vs ~4 GiB, so it's the cheap one.
  #
  # Keep BOTH at symbol granularity (govulncheck's default). Do NOT "fix" a
  # failure here by dropping to -scan package/module: golang.org/x/crypto
  # GO-2026-5932 currently has NO fixed version, and at module granularity it
  # is reported unconditionally — CI would go permanently red with no remedy.
  # At symbol granularity it correctly reads as uncalled.
  #
  # The swapfile is why this step no longer gets OOM-killed. Source-mode
  # govulncheck builds a whole-module SSA graph and peaks near 4 GiB on a COLD
  # build cache (a warm local cache only shows ~1.9 GiB, which is why this is
  # easy to miss when reproducing by hand), and by this point the VM is also
  # still hosting the postgres + mariadb daemons the test task left running.
  # The result was `Killed` — SIGKILL from the OOM killer, with no scan output
  # at all, which reads nothing like a vulnerability report.
  - vuln: |
      cd dazyflow
      sudo fallocate -l 4G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=4096
      sudo chmod 600 /swapfile
      sudo mkswap /swapfile
      sudo swapon /swapfile
      free -h
      go install golang.org/x/vuln/cmd/govulncheck@latest
      GV="$(go env GOPATH)/bin/govulncheck"
      "$GV" ./...
      # Symbol scan of each shipped binary. docsgen is a build-time tool, not
      # shipped, so it is deliberately out of scope.
      mkdir -p /tmp/vulnbin
      for c in dzd dzctl dz-mcp; do
        go build -o "/tmp/vulnbin/$c" "./cmd/$c"
        echo "--- govulncheck -mode binary $c"
        "$GV" -mode binary "/tmp/vulnbin/$c"
      done
  # Software Bill of Materials (A.8.25 / A.8.29 supply-chain). syft scans the
  # Go module graph and emits SPDX + CycloneDX JSON. CI guarantees the SBOM
  # always generates; releases (tagged + pushed by hand) attach
  # sbom.spdx.json / sbom.cdx.json to the artifact set. Not committed —
  # see .gitignore.
  - sbom: |
      cd dazyflow
      curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
        | sh -s -- -b "$(go env GOPATH)/bin"
      "$(go env GOPATH)/bin/syft" dir:. \
        -o spdx-json=sbom.spdx.json \
        -o cyclonedx-json=sbom.cdx.json
      echo "generated sbom.spdx.json + sbom.cdx.json"
  - dzctl-e2e: |
      cd dazyflow
      bash examples/csv-pipeline/run.sh
  # The two catalogues the web guards read (the app list behind the integration
  # description guard, the drop text behind the Swedish coverage guard) are
  # generated from the live drop registry and committed. A stale one makes its
  # guard pass vacuously — "every drop has a Swedish description" is only true
  # of the drops the snapshot remembers — so regenerate and diff before the web
  # task runs the guards against them.
  - catalogs: |
      cd dazyflow
      make catalogs-check
  # A released CHANGELOG section describes what is in its tag. Editing one is
  # invisible in review — correct prose under a plausible heading — and it takes
  # the next release down with it, since the entry that should have gone under
  # [Unreleased] left it empty. See scripts/check-changelog.sh.
  - changelog: |
      cd dazyflow
      make check-changelog
  # `npm run build` is `tsc -b && vite build`, so a type error fails here — but
  # it does NOT run the unit tests, which meant the whole vitest suite (error
  # explainers, port typing, the Swedish catalog vocabulary and its drift
  # guards) was unrun in CI and could rot unnoticed. `npm test` is `vitest run`.
  #
  # `make docs-content` first: the docs SPA content tree (web/src/docs/content/)
  # is generated — guide pages copied from docs/guide/, the step catalog emitted
  # by cmd/docsgen — and git-ignored, so on a fresh clone content.ts globs an
  # empty directory. The docs task below regenerates it anyway, but it runs
  # AFTER this one, which left the docs-search tests failing here with "Nothing
  # matches" — a missing-content failure that reads as a search bug.
  - web: |
      cd dazyflow
      make docs-content
      cd web
      npm ci
      npm test
      npm run build
  # Build the docs site (docs.dazyflow.app) so the published docs can't drift
  # from the code: `make docs-site` regenerates the step catalog from the live
  # drop manifests (go run ./cmd/docsgen) and Vite-builds the docs SPA (which
  # reuses the app shell). A broken manifest, a bad docsgen change, a type error,
  # or a broken guide page fails here. Generated content + dist are git-ignored.
  - docs: |
      cd dazyflow
      make docs-site
  # Build BOTH deployable images, and on a tag build, publish them to the
  # private registry the production box pulls from.
  #
  # This is what stops prod compiling its own releases. That droplet is
  # s-1vcpu-2gb: a Go build plus two Vite builds on one core cannot finish
  # inside a runner step's 10-minute timeout, and the attempt starved the whole
  # site (kswapd pegged, TLS handshakes timing out) before being killed. Here it
  # is free — the VM is already warm from the test tasks.
  #
  # Branch builds still BUILD both images, because that is the only thing
  # exercising the Dockerfiles; they just do not push. Pushing is gated twice,
  # and both gates exit 0 rather than failing: a fork or a contributor without
  # the secret gets a green build, not a confusing red one.
  - docker-image: |
      cd dazyflow
      TAG=$(git describe --exact-match --tags HEAD 2>/dev/null || true)
      VER=${TAG:-ci}
      # Stamp the binary. VERSION is passed as $TAG, which is EMPTY on a branch
      # build — deliberately: the Dockerfile falls back to the committed
      # ./VERSION when this arg is empty, and a non-empty placeholder would
      # SHADOW that fallback, which is the bug that had every non-Makefile
      # build reporting itself as "dev". COMMIT has no fallback at all
      # (ARG COMMIT=unknown), so without passing it a running binary cannot be
      # traced back to a commit — 0.26.2 shipped reporting commit=unknown.
      podman build \
        --build-arg VERSION="$TAG" \
        --build-arg COMMIT="$(git rev-parse --short HEAD)" \
        --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
        -t dazyflow-dzd:$VER .
      # The docs site image (docs.dazyflow.app) — deploy/ references it but
      # nothing exercises Dockerfile.docs otherwise. Same rootless podman.
      podman build -f Dockerfile.docs -t dazyflow-docs:$VER .

      if [ -z "$TAG" ]; then
        echo "not a tag build — images built but not published"
        exit 0
      fi
      if [ ! -e ~/.registry-credentials ]; then
        echo "no ~/.registry-credentials secret — images built but not published"
        exit 0
      fi

      # A builds.sr.ht file secret holding REGISTRY_USER + REGISTRY_PASSWORD.
      . ~/.registry-credentials
      echo "$REGISTRY_PASSWORD" \
        | podman login registry.dazyflow.app -u "$REGISTRY_USER" --password-stdin

      # Every release is published twice: under its own version, which is what
      # `make upgrade` pins, and as :latest, so a bare `docker compose pull`
      # with no VERSION set still lands on the newest release rather than on
      # nothing. See the image: lines in docker-compose.prod.yml.
      for img in dzd docs; do
        podman tag dazyflow-$img:$VER registry.dazyflow.app/dazyflow-$img:$VER
        podman tag dazyflow-$img:$VER registry.dazyflow.app/dazyflow-$img:latest
        podman push registry.dazyflow.app/dazyflow-$img:$VER
        podman push registry.dazyflow.app/dazyflow-$img:latest
      done
      echo "published dazyflow-dzd and dazyflow-docs at $VER"

      # Ask Dazyflow to deploy what was just published. Reached only from the
      # publish path above, so it inherits both its gates: a branch build or a
      # missing registry credential never gets here, and never triggers a
      # deploy. builds.sr.ht's own `triggers:` block cannot do this job — it
      # POSTs with no way to set headers, and the trigger endpoint reads the
      # key ONLY from Authorization (daemon/webhook.go), with no query-param
      # fallback. It would also fire on every green build, not just releases.
      WEBHOOK=""
      for c in "$HOME/.dazyflow-webhook" ./.dazyflow-webhook; do
        [ -e "$c" ] && { WEBHOOK="$c"; break; }
      done
      if [ -z "$WEBHOOK" ]; then
        echo "no .dazyflow-webhook secret — images published, deploy NOT triggered"
        exit 0
      fi
      . "$WEBHOOK"

      # Explicit if/exit rather than relying on the runner's errexit: a release
      # that publishes and then silently fails to deploy is the exact shape of
      # failure this whole setup exists to stop being invisible.
      #
      # A 401 here means the key OR an unpublished flow — the endpoint answers
      # both identically on purpose, so it never reveals which flows exist.
      # Check the flow is published before assuming the key rotated.
      if curl -fsS -X POST \
           -H "Authorization: Bearer $DAZYFLOW_WEBHOOK_KEY" \
           -H "Content-Type: application/json" \
           -d "{\"version\":\"$VER\"}" \
           "https://dazyflow.app/trigger/$DAZYFLOW_FLOW" >/dev/null; then
        echo "deploy triggered for $VER"
      else
        echo "deploy trigger FAILED for $VER (published, but not deployed)"
        exit 1
      fi

triggers:
  - action: email
    condition: failure
    to: klahr@r8.rs
