<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 84 84" width="84" height="84" role="img" aria-label="Dazyflow">
  <title>Dazyflow</title>
  <defs>
    <linearGradient id="dzflow" x1="0" y1="64" x2="64" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1fb6d4"/>
      <stop offset=".4" stop-color="#4c84e8"/>
      <stop offset=".7" stop-color="#9a7bf0"/>
      <stop offset="1" stop-color="#eba7ee"/>
    </linearGradient>
    <!-- Separating border: knock a thin gap out of the back loop along the
         front loop's path (stroke 14 vs the 9 drawn on top → ~2.5px transparent
         moat that hugs the curve). Keeps the two loops distinct on any bg. -->
    <mask id="dzmoat" maskUnits="userSpaceOnUse" x="-10" y="-10" width="84" height="84">
      <rect x="-10" y="-10" width="84" height="84" fill="#fff"/>
      <circle cx="40" cy="24" r="16" fill="none" stroke="#000" stroke-width="14"/>
    </mask>
  </defs>
  <g fill="none" stroke="url(#dzflow)" stroke-width="9">
    <circle cx="24" cy="40" r="16" mask="url(#dzmoat)"/>
    <circle cx="40" cy="24" r="16"/>
  </g>
</svg>
