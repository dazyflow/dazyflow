# Production overlay. Run with explicit -f files so the dev
# docker-compose.override.yml (which disables Postgres TLS) is NOT merged:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Adds Caddy in front of dzd for automatic HTTPS on the apex domain
# (HTTP-01 challenge — needs ports 80/443 reachable, which the DO firewall allows).
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - dzd
      - docs

  # Documentation site (docs.dazyflow.app). Self-contained image: the build
  # generates the step catalog from the live drop manifests and runs the
  # VitePress build, then nginx serves the static output. Nothing is built on
  # the host; Caddy above reverse-proxies docs.dazyflow.app here. Rebuild with
  # `docker compose ... up -d --build docs` when a drop manifest or guide page
  # changes.
  docs:
    build:
      context: .
      dockerfile: Dockerfile.docs
      # Same host-network + GOPROXY story as the dzd build (docs generation
      # runs `go mod download`); see docker-compose.yml and Dockerfile.
      network: host
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    restart: unless-stopped
    # No host port — only Caddy (same compose network) reaches it as `docs:80`.
    expose:
      - "80"

volumes:
  caddy_data:
  caddy_config:
