# Production overlay. Adds Postgres TLS (ssl=on), Caddy and the docs site on
# top of the base stack. Run with explicit -f files so any local
# docker-compose.override.yml is NOT merged:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# `PROD=1 make upgrade` (or `PROD=1 make restart`) wraps that command with the
# same -f pair plus the VERSION/COMMIT/BUILD_DATE stamp, so prefer it — a bare
# invocation stamps only what ./VERSION carries (no commit, no build date). See
# "Version stamping & upgrades" in docs/DEPLOY.md.
#
# Adds Caddy in front of dzd for automatic HTTPS on the apex domain
# (HTTP-01 challenge — needs ports 80/443 reachable, which the DO firewall allows).
services:
  # Postgres TLS for the dzd↔Postgres hop (separate from Caddy's
  # browser↔dzd TLS below). Needs ./certs generated on the host first and
  # sslmode=require in the DSN — see docs/DEPLOY.md → "Postgres TLS for the
  # bundled service".
  postgres:
    command:
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/certs/server.crt
      - -c
      - ssl_key_file=/certs/server.key
    volumes:
      # Key must be 0600 and owned by uid 70 on the host.
      - ./certs:/certs:ro

  caddy:
    image: caddy:2
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Bind-mount the whole deploy/ directory (Caddy reads /etc/caddy/Caddyfile;
      # the other files sit alongside, unused) rather than the single Caddyfile.
      # A single-file bind mount pins to the file's inode at container start, so
      # a `git pull` that replaces deploy/Caddyfile with a new inode is invisible
      # inside the container until it's recreated — `caddy reload` then reports
      # "config unchanged". Mounting the directory means the container resolves
      # the file fresh each read, so `caddy reload` picks up edits with no
      # recreate. Read-only: Caddy writes only to /data and /config.
      - ./deploy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - dzd
      - docs

  # Release images come from GitHub Container Registry, built and pushed by
  # .github/workflows/ci.yml. This box only ever pulls.
  #
  # This replaces the self-hosted `registry:2` service that used to run here.
  # That existed because the images had nowhere else to live: CI pushed to
  # https://registry.dazyflow.app (Caddy fronting it with TLS + basic auth) and
  # the host pulled from 127.0.0.1:5000, where Docker waives its HTTPS
  # requirement. ghcr is the same blob store without the two doors, the
  # credential pair, or the `registry garbage-collect` chore that kept a 50GB
  # droplet from filling up.
  #
  # GHCR_OWNER is the GitHub account or org that owns the packages, lower-case
  # (ghcr rejects an uppercase path segment). Set it in .env.
  #
  # A ghcr package is PRIVATE by default, and an anonymous `docker pull` of one
  # fails with a 401 that reads like "not found". Either make both packages
  # public, or log the host in once with a token holding read:packages:
  #
  #   docker login ghcr.io -u YOUR_LOGIN --password-stdin   (paste the PAT)
  #
  # GHCR_OWNER is deliberately `:?` rather than defaulted: an empty value would
  # resolve to ghcr.io//dazyflow-dzd and fail at pull time with a registry error
  # that says nothing about the real cause.
  #
  # The release image, pulled — never built here. The `build:` stanza in
  # docker-compose.yml stays valid as an escape hatch (`--build` still works if
  # the registry is ever unreachable), but the deploy path is pull-only: see the
  # `upgrade` target in the Makefile.
  #
  # CI pushes every release as both :X.Y.Z and :latest, so an unset VERSION
  # resolves to the newest release rather than to nothing. `make upgrade` sets
  # it explicitly to the tag it selected, which is the deterministic path.
  dzd:
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER in .env}/dazyflow-dzd:${VERSION:-latest}

  # Documentation site (docs.dazyflow.app). Self-contained image: the build
  # generates the step catalog from the live drop manifests, Vite-builds the
  # docs SPA (React, reusing the app shell), then nginx serves it. Nothing is
  # built on the host; Caddy above reverse-proxies docs.dazyflow.app here.
  # Rebuild with `docker compose ... up -d --build docs` when a drop manifest,
  # guide page, or the docs UI changes.
  docs:
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER in .env}/dazyflow-docs:${VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile.docs
      # Same host-network + GOPROXY story as the dzd build (docs generation
      # runs `go mod download`); see docker-compose.yml and Dockerfile.
      network: host
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    restart: unless-stopped
    # No host port — only Caddy (same compose network) reaches it as `docs:80`.
    expose:
      - "80"

volumes:
  caddy_data:
  caddy_config:
