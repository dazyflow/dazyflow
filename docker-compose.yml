# Canonical self-host stack: Postgres + hzd. One command:
#
#   cp .env.example .env   # optional — defaults boot as-is
#   docker compose up -d
#
# brings everything up, runs migrations, and serves the API + web UI on
# http://localhost:8080 (gRPC on :50050). Control-plane state (jobs, API
# keys, sessions, users, encrypted secrets) persists to Postgres; graphs
# + sandboxes persist to the hzddata volume, so `docker compose down` is
# safe.
#
# Override anything below via a sibling .env file (see .env.example).
# Defaults are tuned for first-boot ergonomics, NOT production. Before
# putting this in front of users:
#
#   1. Set POSTGRES_PASSWORD to something other than "hazyflow" (and
#      update HAZYFLOW_POSTGRES_DSN to match).
#   2. Set HAZYFLOW_MASTER_KEY to a real key (openssl rand -base64 32)
#      and keep a sealed backup.
#   3. Set HAZYFLOW_PUBLIC_BASE_URL + HAZYFLOW_WEB_ORIGIN to your real
#      https origin.
#   4. Front the app with TLS (Caddy / nginx / Traefik) and set
#      HAZYFLOW_TRUST_PROXY_HEADERS=1.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-hazyflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hazyflow}
      POSTGRES_DB:       ${POSTGRES_DB:-hazyflow}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hazyflow} -d ${POSTGRES_DB:-hazyflow}"]
      interval: 5s
      timeout: 3s
      retries: 10

  hzd:
    build:
      context: .
      dockerfile: Dockerfile
      # Build RUN steps (go mod download, npm ci) use the host network.
      # Required under LXC, where Docker's default build bridge can't
      # route out ("dial tcp …: network is unreachable"); harmless on a
      # normal host where the bridge works fine.
      network: host
    restart: unless-stopped
    # env_file forwards every HAZYFLOW_* var the operator sets in .env
    # straight to the container — see .env.example for the full
    # catalogue. The explicit environment: block below only covers vars
    # that need a non-trivial default for first-boot ergonomics OR a
    # transformation (LANDING_DIR's host-path → /srv/landing mapping).
    # Everything else flows through env_file with no per-var compose
    # edit needed.
    env_file:
      - path: .env
        required: false
    environment:
      TZ: ${TZ:-UTC}
      # Default to the bundled postgres service when .env doesn't set
      # this. Keeps first-boot working with no .env at all.
      HAZYFLOW_POSTGRES_DSN: ${HAZYFLOW_POSTGRES_DSN:-postgres://${POSTGRES_USER:-hazyflow}:${POSTGRES_PASSWORD:-hazyflow}@postgres:5432/${POSTGRES_DB:-hazyflow}?sslmode=disable}
      # First-boot defaults. .env values override these.
      HAZYFLOW_WEB_ORIGIN:           ${HAZYFLOW_WEB_ORIGIN:-http://localhost:8080}
      HAZYFLOW_SESSION_TTL:          ${HAZYFLOW_SESSION_TTL:-24h}
      # Marketing landing: HAZYFLOW_LANDING_DIR in .env is the *host*
      # path of your built hazy-flow-landing checkout; the volume below
      # mounts it to the fixed in-container path /srv/landing, and hzd
      # reads from that fixed path. The `:+` form means: when the host
      # var is set, hzd reads /srv/landing; when empty, hzd gets "" and
      # / serves the SPA for everyone.
      HAZYFLOW_LANDING_DIR:          ${HAZYFLOW_LANDING_DIR:+/srv/landing}
    # No command: — the image's ENTRYPOINT runs hzd and every setting is
    # driven by HAZYFLOW_* env vars (container layout defaults are baked
    # into the Dockerfile via ENV).
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${HAZYFLOW_BIND_ADDR:-127.0.0.1}:${HAZYFLOW_PORT:-8080}:8080"
    volumes:
      - hzddata:/data
      # Marketing landing: HAZYFLOW_LANDING_DIR (.env) is the *host* path of
      # the built hazy-flow-landing checkout — it must hold landing.html at
      # its root. Mount it read-only at the fixed container path /srv/landing
      # that hzd reads (see the environment block above). Host path comes
      # from the env; container path is hardcoded.
      - ${HAZYFLOW_LANDING_DIR:-/srv/landing}:/srv/landing:ro
    # No container healthcheck: the distroless image ships no shell/curl.
    # Use the daemon's HTTP /healthz + /readyz (or the gRPC health
    # service) from your orchestrator — see deploy/k8s/hazyflow.yaml.

volumes:
  pgdata:
  hzddata:
