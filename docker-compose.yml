# Canonical self-host stack: Postgres + dzd.
#
#   cp .env.example .env   # then set the values in steps 1–5 below
#   docker compose up -d
#
# brings everything up and serves the API + web UI on
# http://localhost:8642 (gRPC on :50050). Control-plane state (jobs, API
# keys, sessions, users, encrypted secrets) persists to Postgres; graphs
# + sandboxes persist to the dzddata volume, so `docker compose down` is
# safe.
#
# Override anything below via a sibling .env file (see .env.example).
# NOTE: dzd refuses to boot with the bundled default DB password or an
# empty master key once a database is configured (it always is here), so
# steps 1 and 2 are mandatory — not just recommended. For a throwaway
# local trial, DAZYFLOW_DEV=1 downgrades that guard to warnings. Before
# putting this in front of users:
#
#   1. Set POSTGRES_PASSWORD to something other than "dazyflow" (and
#      update DAZYFLOW_POSTGRES_DSN to match).
#   2. Set DAZYFLOW_MASTER_KEY to a real key (openssl rand -base64 32)
#      and keep a sealed backup.
#   3. Encrypt the dzd↔Postgres hop: sslmode=require in the DSN, plus
#      docker-compose.prod.yml for ssl=on. See docs/DEPLOY.md.
#   4. Set DAZYFLOW_PUBLIC_BASE_URL + DAZYFLOW_WEB_ORIGIN to your real
#      https origin.
#   5. Front the app with TLS (Caddy / nginx / Traefik) and set
#      DAZYFLOW_TRUST_PROXY_HEADERS=1.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # No `command:` — the image default (SSL off) matches the default
    # sslmode=disable DSN, so a fresh clone boots with no cert files.
    # ssl=on + the ./certs mount live in docker-compose.prod.yml.
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-dazyflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dazyflow}
      POSTGRES_DB:       ${POSTGRES_DB:-dazyflow}
    # Published on the host loopback only — lets `make dev` (dzd running on
    # the host via `go run`) reach the bundled database, and lets an operator
    # run psql for backups. Not exposed off-host.
    # 5442 on the host, not 5432: a local Postgres on the standard port would
    # abort the stack with "port is already allocated". Container side is
    # unchanged, so dzd still reaches it as postgres:5432.
    ports:
      - "${DAZYFLOW_PG_BIND_ADDR:-127.0.0.1}:${DAZYFLOW_PG_PORT:-5442}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dazyflow} -d ${POSTGRES_DB:-dazyflow}"]
      interval: 5s
      timeout: 3s
      retries: 10

  dzd:
    build:
      context: .
      dockerfile: Dockerfile
      # Build RUN steps (go mod download, npm ci) use the host network.
      # Required under LXC, where Docker's default build bridge can't
      # route out ("dial tcp …: network is unreachable"); harmless on a
      # normal host where the bridge works fine.
      network: host
      # Version stamping. The Makefile (up/build/restart/rebuild/upgrade)
      # exports VERSION/COMMIT/BUILD_DATE from git before invoking compose.
      # When they're unset — a bare `docker compose up --build`, which is
      # how the production overlay is deployed — these resolve to EMPTY and
      # the Dockerfile falls back to the committed ./VERSION file plus the
      # in-container build date. Do NOT put a "dev" default back here: a
      # literal "dev" build arg SHADOWS that fallback, which is exactly how
      # every non-Makefile build came to report itself as "dev". See the
      # Dockerfile ARGs and core/buildinfo.
      args:
        VERSION: ${VERSION:-}
        COMMIT: ${COMMIT:-unknown}
        BUILD_DATE: ${BUILD_DATE:-}
    restart: unless-stopped
    # env_file forwards every DAZYFLOW_* var the operator sets in .env
    # straight to the container — see .env.example for the full
    # catalogue. The explicit environment: block below only covers vars
    # that need a non-trivial default for first-boot ergonomics OR a
    # transformation (LANDING_DIR's host-path → /srv/landing mapping).
    # Everything else flows through env_file with no per-var compose
    # edit needed.
    env_file:
      - path: .env
        required: false
    environment:
      TZ: ${TZ:-UTC}
      # Default to the bundled postgres service when .env doesn't set
      # this. Keeps first-boot working with no .env at all.
      DAZYFLOW_POSTGRES_DSN: ${DAZYFLOW_POSTGRES_DSN:-postgres://${POSTGRES_USER:-dazyflow}:${POSTGRES_PASSWORD:-dazyflow}@postgres:5432/${POSTGRES_DB:-dazyflow}?sslmode=disable}
      # First-boot defaults. .env values override these.
      DAZYFLOW_WEB_ORIGIN:           ${DAZYFLOW_WEB_ORIGIN:-http://localhost:8642}
      DAZYFLOW_SESSION_TTL:          ${DAZYFLOW_SESSION_TTL:-168h}
      DAZYFLOW_SESSION_MAX_AGE:      ${DAZYFLOW_SESSION_MAX_AGE:-720h}
      # Marketing landing: DAZYFLOW_LANDING_DIR in .env is the *host*
      # path of your built dazyflow-landing checkout; the volume below
      # mounts it to the fixed in-container path /srv/landing, and dzd
      # reads from that fixed path. The `:+` form means: when the host
      # var is set, dzd reads /srv/landing; when empty, dzd gets "" and
      # / serves the SPA for everyone.
      DAZYFLOW_LANDING_DIR:          ${DAZYFLOW_LANDING_DIR:+/srv/landing}
    # No command: — the image's ENTRYPOINT runs dzd and every setting
    # is driven by DAZYFLOW_* env vars. Container layout defaults
    # (DAZYFLOW_HTTP, DAZYFLOW_WEB_DIST, DAZYFLOW_DATA_DIR) are baked
    # into the Dockerfile via ENV.
    depends_on:
      postgres:
        condition: service_healthy
    # 8642 on the host, not 8080, which is too often already taken. Only the
    # published port moved; the daemon still listens on 8080 in the container.
    # Moving it again means changing DAZYFLOW_WEB_ORIGIN to match.
    ports:
      - "${DAZYFLOW_BIND_ADDR:-127.0.0.1}:${DAZYFLOW_PORT:-8642}:8080"
    volumes:
      - dzddata:/data
      # Marketing landing: DAZYFLOW_LANDING_DIR (.env) is the *host* path of
      # the built dazyflow-landing checkout — it must hold landing.html at
      # its root. Mount it read-only at the fixed container path /srv/landing
      # that dzd reads (see the environment block above). Host path comes
      # from the env; container path is hardcoded.
      - ${DAZYFLOW_LANDING_DIR:-/srv/landing}:/srv/landing:ro
    # The node:22-alpine runtime ships busybox wget, so we probe the
    # daemon's HTTP readiness endpoint directly (/readyz pings Postgres).
    # start_period covers first-boot schema setup. k8s/other orchestrators
    # can use the gRPC health service instead — see deploy/k8s/dazyflow.yaml.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/readyz || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
  dzddata:
